services:
  - type: web
    name: tadawol-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: ADVISOR_MODEL
        value: openai/gpt-oss-120b
